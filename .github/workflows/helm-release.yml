name: Release Garnet Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Helm Dependency Repos
        run: |
          helm repo add ollama https://otwld.github.io/ollama-helm/
          helm repo add open-webui https://helm.openwebui.com/

      - name: Build chart dependencies
        run: |
          for chart in charts/*/; do
            helm dependency build "$chart"
          done

      - name: Package charts
        run: |
          mkdir -p .cr-release-packages
          for chart in charts/*/; do
            helm package "$chart" --destination .cr-release-packages/
          done

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
            helm registry login harbor.enclaive.cloud \
              --username "${{ secrets.HARBOR_USERNAME }}" \
              --password-stdin

      - name: Push charts to Harbor OCI registry
        run: |
          shopt -s nullglob
          pkgs=(.cr-release-packages/*.tgz)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No chart packages found."
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            echo "Pushing ${pkg} to harbor.enclaive.cloud/garnet"
            helm push "${pkg}" oci://harbor.enclaive.cloud/garnet
          done
