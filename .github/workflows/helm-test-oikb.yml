name: Check Open WebUI Helm Charts (oikb)

on:
  pull_request:
    paths:
      - "charts/oikb/**"
  push:
    paths:
      - "charts/oikb/**"

jobs:
  lint-chart:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint oikb Helm Chart
        run: |
          helm lint ./charts/oikb

  test-template:
    name: Test Chart Template
    runs-on: ubuntu-latest
    needs: lint-chart
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up KinD Cluster
        uses: helm/kind-action@v1

      - name: Template oikb Helm Chart (daemon, explicit key)
        run: |
          helm template oikb ./charts/oikb \
            --set openWebuiApiKey=sk-ci \
            --set openWebuiUrl=http://open-webui:8080 \
            --namespace test-namespace > oikb.yaml

      - name: Apply and verify resources
        run: |
          kubectl create namespace test-namespace
          kubectl apply --namespace test-namespace -f oikb.yaml
          kubectl --namespace test-namespace get deployment -l app.kubernetes.io/part-of=oikb
          kubectl --namespace test-namespace get service -l app.kubernetes.io/part-of=oikb

      - name: Template oikb Helm Chart (cronjob mode)
        run: |
          helm template oikb ./charts/oikb \
            --set mode=cronjob \
            --set openWebuiApiKey=sk-ci \
            --set openWebuiUrl=http://open-webui:8080 \
            --namespace test-namespace | kubectl apply --dry-run=client -f -
