{{- if not .Values.existingConfigSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oikb.configSecretName" . }}
  namespace: {{ include "oikb.namespace" . }}
  labels:
    {{- include "oikb.labels" . | nindent 4 }}
type: Opaque
stringData:
  .oikb.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
{{- end }}
