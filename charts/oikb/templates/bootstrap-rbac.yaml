{{- if include "oikb.bootstrapActive" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oikb.fullname" . }}-bootstrap
  namespace: {{ include "oikb.namespace" . }}
  labels:
    {{- include "oikb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oikb.fullname" . }}-bootstrap
  namespace: {{ include "oikb.namespace" . }}
  labels:
    {{- include "oikb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # create cannot be restricted by resourceName
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # get/patch limited to the single OWUI-key Secret
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "oikb.owuiKeySecretName" . }}"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oikb.fullname" . }}-bootstrap
  namespace: {{ include "oikb.namespace" . }}
  labels:
    {{- include "oikb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oikb.fullname" . }}-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "oikb.fullname" . }}-bootstrap
    namespace: {{ include "oikb.namespace" . }}
{{- end }}
